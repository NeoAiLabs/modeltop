[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modeltop"
version = "0.1.0"
description = "Terminal dashboard for monitoring and benchmarking local LLM servers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ModelTop Contributors" }]
dependencies = [
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=13.9",
    "tool-eval-bench @ git+https://github.com/SeraphimSerapis/tool-eval-bench.git@7ec8fcf33943020349ff6df339834a7ef984da00",
    "textual>=8.2.8",
]

[project.scripts]
mtop = "modeltop.app:run"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/modeltop"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
